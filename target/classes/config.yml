# Konfiguracja SimpleClan

# Język pluginu (pl, en)
language: "pl"

# Ustawienia klanów
clan:
  max-members: 10
  max-name-length: 16
  min-name-length: 3
  max-moderators: 2
  tag-format: "{color}[{clan}]&r"

  # Dostępne kolory tagów
  available-colors:
    - "&6" # Złoty (domyślny)
    - "&c" # Czerwony
    - "&a" # Zielony
    - "&b" # Jasnoniebieski
    - "&e" # Żółty
    - "&d" # Różowy
    - "&9" # Niebieski
    - "&5" # Fioletowy
    - "&f" # Biały
    - "&7" # Szary

# Ustawienia chatu klanowego
chat:
  # Format wiadomości na czacie klanowym
  # {role} - rola w klanie (lider/zastępca/pusty)
  # {player} - nick gracza
  # {message} - treść wiadomości
  format: "&8[&6Klan&8] &r{role}&e{player}&7: &f{message}"

  # Format roli dla lidera
  leader-role: "&6[Lider] "

  # Format roli dla zastępcy
  moderator-role: "&a[Zastępca] "

# Ustawienia PvP
pvp:
  # Czy domyślnie PvP w klanie jest włączone dla nowych klanów
  default-enabled: false

# Ustawienia rankingu
ranking:
  # Ile klanów wyświetlać w rankingu
  top-clans: 10

  # Czy broadcastować zabójstwa
  broadcast-kills: true
